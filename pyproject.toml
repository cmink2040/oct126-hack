[project]
name = "chiro-agents"
version = "0.1.0"
description = "Agentic AI for a chiropractic clinic on Databricks (leads, retention, pricing)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "databricks-sdk>=0.40",
    "openai>=1.40",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
